<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reproductor</title>
<style>
    body { margin: 0; background: #000; }
    #player { width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="player"></div>

<script type="text/javascript">
    var width = 720;
    var height = 480;
    var channel = 'fghghb444gh';
    var g = '1';

    var isMobile = {
        Android: () => navigator.userAgent.match(/Android/i),
        BlackBerry: () => navigator.userAgent.match(/BlackBerry/i),
        iOS: () => navigator.userAgent.match(/iPhone|iPad|iPod/i),
        Opera: () => navigator.userAgent.match(/Opera Mini/i),
        Mozilla: () => navigator.userAgent.match(/Mozilla/i),
        Windows: () => navigator.userAgent.match(/IEMobile/i),
        Vivo: () => navigator.userAgent.match(/Vivo/i),
        MacOSX: () => navigator.userAgent.match(/Macintosh/i),
        Chrome: () => navigator.userAgent.match(/Chrome/i),
        any: function() {
            return (this.Android() || this.BlackBerry() || this.iOS() || this.Opera() || this.Windows() || this.MacOSX());
        }
    };

    var embedded = "hembedplayer";

    if (typeof(width) == 'undefined') width = 480;
    if (typeof(height) == 'undefined') height = 320;

    if (width < 480) width = 480;
    if (height < 320) height = 320;
    if (width < height) height = width;

    var f_width = isMobile.any() ? "100%" : width;
    var f_height = isMobile.any() ? "100%" : height;

    document.write(
        '<iframe width="' + f_width + '" height="' + f_height +
        '" frameborder="0" allowtransparency="true" marginwidth="0" marginheight="0" ' +
        'src="https://new.goagain.top/' + embedded + '/' + channel + '/' + g + '/' + width + '/' + height +
        '" allowfullscreen></iframe>'
    );
</script>

<script src="https://new.goagain.top/static/scripts/hucaster.js"></script>

</body>
</html>
