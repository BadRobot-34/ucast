<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Player Moderno</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.css" />

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    #player-container {
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Esto hace que el video llene la pantalla */
        background: #000;
    }
</style>
</head>
<body>

<div id="player-container">
    <video id="player" playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.polyfilled.js"></script>

<script>
    const video = document.getElementById('player');
    const source = "https://muc001.myturn1.top:8088/live/fghghb444gh/playlist.m3u8?vidictid=207034169729&id=124353&pk=7c439d5fbaf0334ee901781e0ea1bfe0c3b8b9ede19dccb84cd1892766e4a6d3";

    // Inicializar Plyr con AUTOSTART
    const player = new Plyr('#player', {
        autoplay: true,
        muted: true,
        fullscreen: { enabled: true },
        controls: [
            'play-large',
            'play',
            'pause',
            'progress',
            'current-time',
            'duration',
            'mute',
            'volume',
            'settings',
            'fullscreen'
        ],
        settings: ['quality', 'speed'],
        speed: { selected: 1, options: [0.5, 1, 1.5, 2] }
    });

    // Cargar HLS
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(source);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            video.muted = true;
            video.play();
        });

    } else {
        video.src = source;
        video.muted = true;
        video.play();
    }
</script>

</body>
</html>
