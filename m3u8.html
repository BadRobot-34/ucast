<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Player Moderno</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.css" />

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }

    #player-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
    }

    video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* llena la pantalla desde el inicio */
        background: #000;
    }
</style>
</head>
<body>

<div id="player-container">
    <video id="player" playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.polyfilled.js"></script>

<script>
    const video = document.getElementById('player');
    const source = "https://muc001.myturn1.top:8088/live/fghghb444gh/playlist.m3u8?vidictid=207034169729&id=124353&pk=7c439d5fbaf0334ee901781e0ea1bfe0c3b8b9ede19dccb84cd1892766e4a6d3";

    // Inicializar Plyr
    const player = new Plyr('#player', {
        autoplay: true,
        muted: true,  // requerido para autoplay en WebView
        fullscreen: { enabled: true },
        controls: [
            'play-large',
            'play',
            'pause',
            'progress',
            'current-time',
            'duration',
            'mute',
            'volume',
            'settings',
            'fullscreen'
        ],
        settings: ['speed'],
        speed: { selected: 1, options: [0.5, 1, 1.5, 2] }
    });

    // Cargar HLS
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(source);
        hls.attachMedia(video);

        // Cuando el stream empieza → activar sonido
        hls.on(Hls.Events.LEVEL_LOADED, function () {
            setTimeout(() => {
                video.muted = false;   // activar sonido
                video.play();          // reproducir con sonido
            }, 300); // pequeño delay para evitar bloqueo del WebView
        });

    } else {
        video.src = source;
        setTimeout(() => {
            video.muted = false;
            video.play();
        }, 300);
    }
</script>

</body>
</html>
